name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/toolkits-test
      - run: /tmp/toolkits-test/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/toolkits-test/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Check open-source package
        run: npm run open-source:check
      - name: Build frontend
        run: npm run build
      - name: Test frontend contracts
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
